const SK='fam.k';
const $=id=>document.getElementById(id);
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(bits){
 const ek=bits.slice(0,32),mk=bits.slice(32),iv=u8(P.iv),ct=u8(P.ct);
 const hk=await crypto.subtle.importKey('raw',mk,{name:'HMAC',hash:'SHA-256'},false,['verify']);
 const d=new Uint8Array(iv.length+ct.length);d.set(iv);d.set(ct,iv.length);
 if(!await crypto.subtle.verify('HMAC',hk,u8(P.mac),d))return null;
 const ak=await crypto.subtle.importKey('raw',ek,{name:'AES-CBC'},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ak,ct));
}
async function derive(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(P.salt),iterations:P.it,hash:'SHA-256'},km,512));
}
function render(html){
 document.open();document.write(html);document.close();
 const h=decodeURIComponent(location.hash.slice(1));
 if(h)setTimeout(()=>{const e=document.getElementById(h);if(e)e.scrollIntoView()},120);
}
(async()=>{
 if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));
 await new Promise(r=>setTimeout(r,50));
 if(!(window.crypto&&crypto.subtle)){$('m').hidden=false;$('e').textContent='Браузеру нужен защищённый контекст: откройте страницу по https.';return}

 $('m').hidden=false;$('p').focus();
 $('f').onsubmit=async ev=>{ev.preventDefault();$('b').disabled=true;$('e').textContent='';
  try{const bits=await derive($('p').value);const h=await open_(bits);
   if(h){try{sessionStorage.setItem(SK,btoa(String.fromCharCode(...bits)))}catch(e){}render(h);return}
   $('e').textContent='Неверный пароль.';$('p').select()}
  catch(e){$('e').textContent='Не удалось расшифровать страницу.'}
  $('b').disabled=false};
})();
